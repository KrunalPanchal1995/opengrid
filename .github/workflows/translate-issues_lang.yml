name: Translate and Label Issues

on:
  issues:
    types: [opened, edited]

jobs:
  translate-and-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check, Translate, and Label
        uses: actions-cool/issues-translator@v1
        with:
          # Automatically translates non-English issues to English
          target-language: 'en' 
          # This tells the bot to add a language label (e.g., lang-zh, lang-ja)
          add-labels: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
